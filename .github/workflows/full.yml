# Full verification: the CI suite plus every long run (exhaustive simulations, slow formal proofs).
# Start it from the Actions tab ("Run workflow"); pushing a version tag (v*) also runs it and publishes a
# GitHub release with all build outputs and the summary attached.
name: Full verification

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04@sha256:f144425ff09be612d6d9ad965196e9cdc23dae1f42110a8a11a3e9a8198759f7
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: bash scripts/install-tools.sh
      - name: Generated RTL is up to date
        run: make check-rtl
      - name: Lint
        run: make lint
      - name: Simulate (Icarus and Verilator)
        run: make sim
      - name: Mutation test
        run: make mutants
      - name: Synthesize
        run: make synth
      - name: Design-space exploration
        run: make explore
      - name: Exhaustive 13 x 13-bit products, both controllers
        run: make exhaustive
      - name: Formal (all proofs)
        run: make formal
      - name: Summary
        if: always()
        run: bash scripts/summary.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build
          path: |
            build/
            !build/**/obj_*/**
            !build/**/*.vvp
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-build
          path: build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-build"
          tar -czf "$name.tar.gz" build
          gh release create "$GITHUB_REF_NAME" "$name.tar.gz" build/SUMMARY.md --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file build/SUMMARY.md
